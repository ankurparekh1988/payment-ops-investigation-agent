# AI release manifest: the models and prompts this release runs on.
#
# Terraform creates the model deployments from this file, and the application embeds the same file
# at build time, so infrastructure and application can't disagree about which model or prompt is
# live. Changes go through a pull request. Versions are pinned and never auto-upgraded.
#
# capacityK is the deployment's rate limit in thousands of tokens per minute. Global Standard is
# billed per token, so capacity costs nothing while idle.
#
# contentFilterPolicy: "strict" is this project's policy; "default" is Microsoft's default filter.
#
# A deployment the release on main uses keeps its name, model, version, deployment type and filter:
# Terraform changes it before the new build replaces the running app. Capacity can change in place.

schemaVersion: 1

models:
  chat:
    # Blue/green slots: a new model version or filter goes into the inactive slot, is evaluated
    # there, and is promoted by switching "active". Outside an upgrade only the active slot exists.
    active: blue
    deployments:
      blue:
        deployment: chat-blue
        model: gpt-5.4-mini
        version: "2026-03-17"
        deploymentType: GlobalStandard
        capacityK: 50
        contentFilterPolicy: strict

  embedding:
    deployment: embed-v1
    model: text-embedding-3-small
    version: "1"
    deploymentType: GlobalStandard
    capacityK: 50

  # Scores answers during evaluation. Pinned separately so judge behaviour changes only on purpose.
  # It reads deliberately unsafe answers in safety evaluations, so it keeps Microsoft's default filter.
  judge:
    deployment: judge
    model: gpt-5.4-mini
    version: "2026-03-17"
    deploymentType: GlobalStandard
    capacityK: 50
    contentFilterPolicy: default

# The search index the knowledge corpus is published to, and how the app queries it. A schema change
# that Search can't apply in place gets a new name, and the old index is removed by hand once nothing
# reads it. mode is lexical or semantic; semanticFloor (semantic only, 0-4) drops weaker hits.
retrieval:
  index: knowledge-v1
  mode: lexical

# Prompts embedded in the application, keyed by id. A prompt's body can't change without a higher
# version: CI compares this section with the base branch. Each prompt is added with the code that
# first uses it.
prompts:
  grounded-answer:
    version: 1.0.0
    sha256: sha256:efd63ef575ce1ae22f0cca7cc9f6ed840aac2f991f562d335c87c113dab01010
  investigation-agent:
    version: 1.0.0
    sha256: sha256:a277e5ead17eeb6ba450ac99c8db7f93f64443925ad71f6e6061f49efd6c2f83
