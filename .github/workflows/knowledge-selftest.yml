name: Knowledge self-test

# Proves the knowledge publisher's behaviours against a throwaway index, then deletes it. Manual
# only. It never touches the live index or the infrastructure.
on:
  workflow_dispatch:

permissions:
  contents: read

# Never alongside a deployment or teardown, which may be recreating or removing the service. The
# key must match the one in cd.yml and teardown.yml.
concurrency:
  group: deploy-${{ fromJSON(vars.TERRAFORM_SETTINGS).TF_VAR_environment }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TERRAFORM_VERSION: 1.16.4

jobs:
  self-test:
    name: Self-test
    runs-on: ubuntu-latest
    environment: ${{ fromJSON(vars.TERRAFORM_SETTINGS).TF_VAR_environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The workflow reaches main before the publisher does, so a run on a ref without it fails clearly.
      - name: Check for the publisher
        run: |
          if [[ ! -f tools/PaymentOps.KnowledgePublish/PaymentOps.KnowledgePublish.csproj ]]; then
            echo "::error::The knowledge publisher doesn't exist on $GITHUB_REF_NAME. Run this workflow on a branch that has it."
            exit 1
          fi

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: ./.github/actions/terraform-setup
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          settings: ${{ vars.TERRAFORM_SETTINGS }}

      - name: Find the search endpoint
        id: target
        run: echo "search-endpoint=$(scripts/terraform.sh platform output -raw search_endpoint)" >> "$GITHUB_OUTPUT"

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Self-test
        env:
          SEARCH_ENDPOINT: ${{ steps.target.outputs.search-endpoint }}
        run: dotnet run --project tools/PaymentOps.KnowledgePublish --configuration Release -- --self-test --endpoint "$SEARCH_ENDPOINT"
